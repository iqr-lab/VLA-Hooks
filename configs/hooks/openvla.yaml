record:
  # Compressed record container: writes step_N.pirec instead of step_N.npy.
  # Read with record_io.load_record(path), which also accepts legacy .npy.
  # Set compress: false to restore the old .npy output.
  compress: true
  float_dtype: auto        # auto (lossless) | bf16 | f16 | fp8_e4m3 | none
  codec: zstd              # zstd, falling back to zlib if zstandard is missing
  level: 1                 # 1 is both fastest and smallest; 1-19 differ by <3%
  shuffle: true
  async_write: true
  max_pending_writes: 4
  writer_threads: 1        # raise to 2-4 if writes to a network filesystem lag the rollout
  log_every: 0             # log encode/write/queue-block timing every N records; 0 disables

hooks:
  enabled:
    - observation_input
    - token_spans
    - prefix_final_hidden_state
    - prefix_gradients
    - action_chunks
    - raw_attention_weights
    - value_vectors

  action_chunks:
    num_chunks: 1

  raw_attention_weights:
    layers: null

  value_vectors:
    layers: null
